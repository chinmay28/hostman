name: HostMan (Android app)

# Builds the phone app and runs its tests whenever it changes, or anything it
# packages does: in full-stack mode the APK carries the hostman server itself,
# built from server/ with the PWA from apps/web embedded, so a change to
# either is a change to the app. The page bridge's contract with the web
# client is tested by the web client's own suite (src/lib/bridge.test.ts).

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "server/**"
      - "scripts/version.mjs"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "server/**"
      - "scripts/version.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the web bundle is stamped with the commit count

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The Go side the app depends on: DNS (and .local over mDNS) and the
      # zone the app hands the server on a phone, and the network search.
      - name: hostenv and discovery tests
        working-directory: server
        run: go test -count=1 ./internal/hostenv/ ./internal/discovery/

      # The launcher and app icons are cut from the logo; a stale copy fails.
      - name: Icons match the logo
        working-directory: tools/icongen
        run: go test ./...

      # Everything the app decides, as plain JVM tests.
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test

      # The runner image ships the Android SDK; ANDROID_HOME points at it.
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease

      # An APK without the server builds fine and then has no full-stack
      # mode at all, so its absence fails the build.
      - name: Check the server is in the APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libhostman.so" || { echo "no libhostman.so for arm64-v8a in $apk" >&2; exit 1; }
          unzip -l "$apk" | grep -q "assets/hostman-bridge.js" || { echo "no page bridge in $apk" >&2; exit 1; }
          echo "libhostman.so and the page bridge are present"

      - uses: actions/upload-artifact@v4
        with:
          name: hostman-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
