# Build and publish a GitHub release for the commit this runs on.
#
# The tag is computed, not typed: scripts/version.mjs renders vYEAR.MONTH.PATCH
# from the commit — YEAR.MONTH its month, PATCH the commit count — so the full
# history matters (fetch-depth: 0; a shallow checkout reports patch 0 and the
# run refuses to release it). The release body is the CHANGELOG.md section
# whose heading names the version exactly.
#
# Three things start it: a tag, a push to main, and a manual dispatch. Only
# those — this job runs with contents: write and publishes under the
# repository's own name, so a branch listed here is a branch whose every push
# can cut a release. A push to main publishes only when the commit names its
# own version in CHANGELOG.md (see "Release notes" below); any other push to
# main is skipped.
#
# What it publishes:
#   hostman-<version>-linux-arm64, hostman-<version>-linux-amd64
#       the server, static, with the PWA embedded — what scripts/quickstart.sh
#       builds on the machine itself, for a machine that would rather not
#   hostman.apk
#       the Android app, under a name that never changes, so
#       .../releases/latest/download/hostman.apk is always the newest
#   SHA256SUMS
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the patch number is the commit count; shallow = 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # For the Android app. The runner image ships the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version
        id: version
        run: |
          VERSION="$(node scripts/version.mjs)"
          PATCH="$(node scripts/version.mjs --patch)"
          DATE="$(node scripts/version.mjs --date)"
          if [ "${PATCH}" = "0" ]; then
            echo "patch is 0 — unstamped build, refusing to release" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} names a commit that builds ${VERSION} — refusing to publish it" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "patch=${PATCH}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      # The changelog heading is the release gate: a branch push whose version
      # has no section is an ordinary commit, not a release, and is skipped —
      # so only a commit that names its own version in CHANGELOG.md publishes.
      # A tag or manual dispatch without the section is an error outright.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v tag="${{ steps.version.outputs.version }}" '
            $0 == "## " tag { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "no '## ${{ steps.version.outputs.version }}' section in CHANGELOG.md — not a release commit, skipping"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section — a tag the changelog does not name must not be published" >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Straight into the server's embed directory, as `make build` does.
      - name: Build the web app
        if: steps.notes.outputs.release == 'true'
        run: cd apps/web && npm ci && npm run build

      - name: Build hostman binaries
        if: steps.notes.outputs.release == 'true'
        working-directory: server
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG=github.com/chinmay28/hostman/server/internal/version
          mkdir -p ../dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X ${PKG}.Patch=${{ steps.version.outputs.patch }} -X ${PKG}.Date=${{ steps.version.outputs.date }}" \
              -o "../dist/hostman-${VERSION}-linux-${arch}" ./cmd/hostman
          done

      # The release key, so every release installs over the last one. Without
      # the secrets the APK falls back to this runner's debug key, which no
      # earlier release was signed with, so it warns instead of failing.
      - name: Release signing key
        if: steps.notes.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets: the APK is signed with this runner's debug key and will not install over an earlier release"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      # The Android app, which carries this release's server for its
      # full-stack mode. Attached under a name that never changes.
      - name: Build hostman.apk
        if: steps.notes.outputs.release == 'true'
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.patch }}" \
            -PappVersionDate="${{ steps.version.outputs.date }}"
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "expected exactly one release APK, found: ${apks[*]}" >&2
            exit 1
          fi
          unzip -l "${apks[0]}" | grep -q "lib/arm64-v8a/libhostman.so" || { echo "no server in ${apks[0]}" >&2; exit 1; }
          cp "${apks[0]}" ../../dist/hostman.apk

      - name: Checksums
        if: steps.notes.outputs.release == 'true'
        run: (cd dist && sha256sum hostman-* hostman.apk > SHA256SUMS)

      - name: Publish release
        if: steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            echo "release ${VERSION} already exists — nothing to publish"
            exit 0
          fi
          gh release create "${VERSION}" \
            "dist/hostman-${VERSION}-linux-arm64" \
            "dist/hostman-${VERSION}-linux-amd64" \
            dist/hostman.apk \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file notes.md
